name: Build FNF iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib install flixel-addons 3.2.1
          haxelib install flixel-ui 2.5.0
          haxelib install hscript
          haxelib install hxcpp
          haxelib run lime setup

      - name: Build iOS
        run: |
          haxelib run lime build ios -nosign

      - name: Make IPA
        run: |
          mkdir -p Payload
          cp -r export/release/ios/build/Release-iphoneos/*.app Payload/
          zip -r FNF-Game.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Game-iOS
          path: FNF-Game.ipa
